commit-msg:
  skip: merge
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    lint:
      run: pnpm eslint --fix {staged_files}
      glob: "*.{ts,tsx,js,jsx}"
    format:
      run: pnpm prettier --write {staged_files}
      glob: "*.{ts,tsx,js,jsx,json,css,md}"
    git-update:
      run: git update-index --again
      skip: empty

pre-push:
  commands:
    typecheck:
      run: pnpm turbo typecheck
    prevent-direct-push:
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [[ "$branch" == "main" || "$branch" == "devel" ]]; then
          echo "Direct push to '$branch' is forbidden. Use a pull request."
          exit 1
        fi
