commit-msg:
  skip: merge
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    lint:
      run: pnpm turbo run lint -- --fix
      stage_fixed: true
    format:
      run: pnpm turbo run lint:format
      stage_fixed: true
    git-update:
      run: git update-index --again

pre-push:
  commands:
    typecheck:
      run: pnpm run typecheck
    prevent-direct-push:
      run: |
        current_branch=$(git rev-parse --abbrev-ref HEAD)
        protected_branches="main devel"
        if [[ " ${protected_branches} " =~ " ${current_branch} " ]]; then
          echo -e "Direct pushes to the branch '${current_branch}' are forbidden. Use a pull request."
          exit 1
        fi
        exit 0
