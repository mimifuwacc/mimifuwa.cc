name: CI

on:
  pull_request:
    branches:
      - dev
      - release
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          run-install: true

      # Oxfmt
      - run: vp run format:check

      # Oxc/TypeScript lint
      - run: vp run lint

      - name: Checkout private content
        uses: actions/checkout@v7
        with:
          repository: mimifuwacc/mimifuwa.cc-content
          token: ${{ secrets.CONTENT_REPOSITORY_TOKEN }}
          path: .content
          persist-credentials: false

      # 各パッケージの tsc による型チェック
      - run: vp run -r typecheck

      # web の本番ビルド
      - run: vp run -r build
        env:
          MIMIFUWACC_CONTENT_ROOT: ${{ github.workspace }}/.content

      - run: vp test run --passWithNoTests
