name: CI

on:
  pull_request:
    branches:
      - dev
      - release
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: true

      - run: vp run format:check

      - run: vp run lint

      - run: vp run -r check

      - run: vp run -r build

      - run: vp test run --passWithNoTests
