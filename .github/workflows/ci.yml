name: CI

on:
  pull_request:
    branches:
      - devel
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          run-install: true

      # Oxfmt と Astro 用 Prettier
      - run: vp run format:check

      # Oxc/TypeScript lint と Astro 用 ESLint
      - run: vp run lint

      # 各パッケージの tsc による型チェック
      - run: vp run -r typecheck

      # web / admin の本番ビルド
      - run: vp run -r build

      - run: vp test run --passWithNoTests
