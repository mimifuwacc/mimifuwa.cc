name: CI

on:
  pull_request:
    branches:
      - devel
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          run-install: true

      # format + lint + 型チェック
      - run: vp check

      # 各パッケージの tsc による型チェック
      - run: vp run -r typecheck

      - run: vp test run --passWithNoTests
