name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true

      - name: Validate release tag and select package dist-tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="${RELEASE_TAG#v}"
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use v<semver>: $RELEASE_TAG" >&2
            exit 1
          fi

          node scripts/set-package-version.ts "$PACKAGE_VERSION"

          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            PACKAGE_TAG="${PACKAGE_VERSION#*-}"
            PACKAGE_TAG="${PACKAGE_TAG%%.*}"
            if [[ "$PACKAGE_TAG" =~ ^[0-9]+$ ]]; then
              PACKAGE_TAG=next
            fi
          else
            PACKAGE_TAG=latest
          fi

          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_tag=$PACKAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build CLI package
        run: vp run --filter @mimifuwacc/cli build

      - name: Publish CLI to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PNPM_CONFIG__AUTH: '{"https://npm.pkg.github.com":{"@mimifuwacc":{"authToken":"${NODE_AUTH_TOKEN}"}}}'
          PACKAGE_TAG: ${{ steps.release.outputs.package_tag }}
        run: pnpm --filter @mimifuwacc/cli publish --no-git-checks --ignore-scripts --no-provenance --tag "$PACKAGE_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  open-content-upgrade:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: content-release-upgrade
      cancel-in-progress: false
    outputs:
      pull-request-number: ${{ steps.content-pr.outputs.pull-request-number }}
      content-ref: ${{ steps.content-pr.outputs.pull-request-head-sha }}
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - name: Skip stale release upgrades
        id: release-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          if [ "$latest_tag" != "$GITHUB_REF_NAME" ]; then
            echo "Skipping stale release $GITHUB_REF_NAME; latest release is $latest_tag."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create content repository token
        id: app-token
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CONTENT_REPO_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTENT_REPO_APP_PRIVATE_KEY }}
          owner: mimifuwacc
          repositories: mimifuwa.cc-content
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout content repository
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: mimifuwacc/mimifuwa.cc-content
          token: ${{ steps.app-token.outputs.token }}
          path: content

      - name: Setup Node.js
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install pnpm
        if: steps.release-check.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Update CLI dependency lockfile
        if: steps.release-check.outputs.skip != 'true'
        working-directory: content
        env:
          PNPM_CONFIG__AUTH: '{"https://npm.pkg.github.com":{"@mimifuwacc":{"authToken":"${{ secrets.GITHUB_TOKEN }}"}}}'
        run: pnpm update --lockfile-only @mimifuwacc/cli

      - name: Update site release references
        if: steps.release-check.outputs.skip != 'true'
        working-directory: content
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sed -i "s|mimifuwacc/mimifuwa.cc/.github/workflows/deploy.yml@[^[:space:]]*|mimifuwacc/mimifuwa.cc/.github/workflows/deploy.yml@${RELEASE_TAG}|" .github/workflows/publish-content.yml
          sed -i "s|mimifuwacc/mimifuwa.cc.git//infra/terraform/modules/github-environment?ref=[^\"]*|mimifuwacc/mimifuwa.cc.git//infra/terraform/modules/github-environment?ref=${RELEASE_TAG}|" infra/terraform/main.tf

      - name: Open upgrade pull request
        id: content-pr
        if: steps.release-check.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: content
          branch: chore/upgrade-site
          delete-branch: true
          commit-message: "chore(content): upgrade site to ${{ github.ref_name }}"
          title: "chore(content): upgrade site to ${{ github.ref_name }}"
          body: |
            Updates the CLI lockfile, reusable deployment workflow, and shared Terraform module to the `mimifuwa.cc` release `${{ github.ref_name }}`.

            The updated content is deployed to the shared preview environment before auto-merge is enabled.
          add-paths: |
            .github/workflows/publish-content.yml
            infra/terraform/main.tf
            pnpm-lock.yaml

  deploy-content-preview:
    needs: open-content-upgrade
    if: needs.open-content-upgrade.outputs.pull-request-number != ''
    uses: ./.github/workflows/deploy-content-preview.yml
    permissions:
      contents: read
      id-token: write
      packages: read
    with:
      content_repository: mimifuwacc/mimifuwa.cc-content
      content_ref: ${{ needs.open-content-upgrade.outputs.content-ref }}
    secrets: inherit

  enable-content-auto-merge:
    needs: [open-content-upgrade, deploy-content-preview]
    if: needs.open-content-upgrade.outputs.pull-request-number != '' && needs.deploy-content-preview.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create content repository token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CONTENT_REPO_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTENT_REPO_APP_PRIVATE_KEY }}
          owner: mimifuwacc
          repositories: mimifuwa.cc-content
          permission-pull-requests: write

      - name: Enable auto-merge for content upgrade
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: mimifuwacc/mimifuwa.cc-content
          PR_NUMBER: ${{ needs.open-content-upgrade.outputs.pull-request-number }}
          EXPECTED_CONTENT_REF: ${{ needs.open-content-upgrade.outputs.content-ref }}
        run: |
          current_ref=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          if [ "$current_ref" != "$EXPECTED_CONTENT_REF" ]; then
            echo "The upgrade PR changed during preview deployment; a newer release will deploy the latest commit."
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --auto --squash
