name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  publish-cli:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true

      - name: Verify release tag and select package dist-tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="${RELEASE_TAG#v}"
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use v<semver>: $RELEASE_TAG" >&2
            exit 1
          fi

          node scripts/set-package-version.ts "$PACKAGE_VERSION"

          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            PRERELEASE="${PACKAGE_VERSION#*-}"
            NPM_TAG="${PRERELEASE%%.*}"
            if [[ "$NPM_TAG" =~ ^[0-9]+$ ]]; then
              NPM_TAG=next
            fi
          else
            NPM_TAG=latest
          fi

          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"

      - name: Build CLI package
        run: vp run --filter @mimifuwacc/cli build

      - name: Publish CLI package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_TAG: ${{ steps.release.outputs.package_tag }}
        run: vp pm publish ./packages/cli --registry https://npm.pkg.github.com --tag "$PACKAGE_TAG" --no-git-checks -- --ignore-scripts

  release:
    needs: publish-cli
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
