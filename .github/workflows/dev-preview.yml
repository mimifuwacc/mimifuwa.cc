name: Dev Preview

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# dotenvx: GitHub Secrets に載せるのは復号鍵だけ。CLOUDFLARE_* / ADMIN_SECRET /
# Cloudflare credentials / ADMIN_SECRET are injected from the encrypted env file.
env:
  DOTENV_PRIVATE_KEY_DEV: ${{ secrets.DOTENV_PRIVATE_KEY_DEV }}

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://web-dev.mimifuwa.cc
    steps:
      - uses: actions/checkout@v7

      - name: Checkout private content
        uses: actions/checkout@v7
        with:
          repository: mimifuwacc/mimifuwa.cc-content
          token: ${{ secrets.CONTENT_REPOSITORY_TOKEN }}
          path: .content
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: apps/web
        env:
          CLOUDFLARE_ENV: dev
          MIMIFUWACC_CONTENT_ROOT: ${{ github.workspace }}/.content
        run: pnpm run build

      - name: Deploy web to Cloudflare
        working-directory: apps/web
        env:
          CLOUDFLARE_ENV: dev
        run: pnpm exec wrangler deploy --config wrangler.jsonc --env dev
