name: Dev Preview

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://mimifuwa-cc-dev.m8c.workers.dev
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_ENV: dev
    steps:
      - uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true

      - name: Build content CLI
        run: vp exec --filter @mimifuwacc/cli -- tsc -p tsconfig.json

      - name: Deploy Vue site to Void
        run: vp exec --filter @mimifuwacc/web -- void deploy --platform cloudflare

      - name: Publish dev content
        env:
          CONTENT_DIR: ${{ github.workspace }}/packages/content-dev/articles
        run: vp exec --filter @mimifuwacc/cli -- mimifuwacc deploy
