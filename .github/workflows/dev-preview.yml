name: Dev Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: dev
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_ENV: dev
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true

      - name: Restore article OG image cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/og-image-cache
          key: ${{ runner.os }}-og-images-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-og-images-

      - name: Build content CLI
        run: vp exec --filter @mimifuwacc/cli -- tsc -p tsconfig.json

      - name: Set package versions from the latest tag
        run: node scripts/set-package-version.ts "$(git describe --tags --abbrev=0)"

      - name: Deploy Vue site to Void
        env:
          OG_IMAGE_CACHE_DIR: ${{ runner.temp }}/og-image-cache
        run: vp exec --filter @mimifuwacc/web -- void deploy --platform cloudflare

      - name: Publish dev content
        env:
          CONTENT_DIR: ${{ github.workspace }}/packages/content-dev/articles
          CF_BIN: ${{ github.workspace }}/node_modules/.bin/cf
        run: node packages/cli/dist/cli.js deploy
