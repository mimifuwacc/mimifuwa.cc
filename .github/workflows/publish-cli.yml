name: Publish CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/cli/package.json').version")
          test "$RELEASE_TAG" = "cli-v$PACKAGE_VERSION"

      - name: Build CLI package
        run: vp run --filter @mimifuwacc/cli build

      - name: Publish to npm
        run: npm publish ./packages/cli --access public --provenance --ignore-scripts
