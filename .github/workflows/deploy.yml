name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish-cli:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true

      - name: Verify release tag and select npm dist-tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/cli/package.json').version")
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            PRERELEASE="${PACKAGE_VERSION#*-}"
            NPM_TAG="${PRERELEASE%%.*}"
            if [[ "$NPM_TAG" =~ ^[0-9]+$ ]]; then
              NPM_TAG=next
            fi
          else
            NPM_TAG=latest
          fi

          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"

      - name: Build CLI package
        run: vp run --filter @mimifuwacc/cli build

      - name: Publish CLI package
        env:
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        run: vp pm publish ./packages/cli --access public --provenance --tag "$NPM_TAG" -- --ignore-scripts

  deploy:
    needs: publish-cli
    runs-on: ubuntu-latest
    environment:
      name: ${{ contains(github.ref_name, '-') && 'dev' || 'production' }}
      url: ${{ contains(github.ref_name, '-') && 'https://mimifuwa-cc-dev.m8c.workers.dev' || 'https://mimifuwa.cc' }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_ENV: ${{ contains(github.ref_name, '-') && 'dev' || 'release' }}
    steps:
      - uses: actions/checkout@v7

      - name: Checkout production content
        if: ${{ !contains(github.ref_name, '-') }}
        id: content
        uses: actions/checkout@v7
        with:
          repository: mimifuwacc/mimifuwa.cc-content
          ref: main
          path: mimifuwa.cc-content

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true

      - name: Deploy site to Cloudflare
        run: vp exec --filter @mimifuwacc/web -- void deploy --platform cloudflare

      - name: Publish dev content with the released CLI
        if: ${{ contains(github.ref_name, '-') }}
        env:
          CONTENT_DIR: ${{ github.workspace }}/packages/content-dev/articles
          CONTENT_REVISION: ${{ github.sha }}
          CF_BIN: ${{ github.workspace }}/node_modules/.bin/cf
          CLI_VERSION: ${{ needs.publish-cli.outputs.version }}
        run: vp dlx "@mimifuwacc/cli@$CLI_VERSION" deploy

      - name: Publish production content with the released CLI
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          CONTENT_DIR: ${{ github.workspace }}/mimifuwa.cc-content/articles
          CONTENT_REVISION: ${{ steps.content.outputs.commit }}
          CF_BIN: ${{ github.workspace }}/node_modules/.bin/cf
          CLI_VERSION: ${{ needs.publish-cli.outputs.version }}
        run: vp dlx "@mimifuwacc/cli@$CLI_VERSION" deploy

  release:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
