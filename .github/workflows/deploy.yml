name: Deploy and Release

on:
  push:
    branches:
      - release
  workflow_dispatch:
  repository_dispatch:
    types: [content-published]

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mimifuwa.cc
    # dotenvx decrypts the committed environment file using the GitHub secret.
    env:
      DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
    steps:
      - uses: actions/checkout@v7

      - name: Checkout private content
        uses: actions/checkout@v7
        with:
          repository: mimifuwacc/mimifuwa.cc-content
          token: ${{ secrets.CONTENT_REPOSITORY_TOKEN }}
          path: .content
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: apps/web
        env:
          MIMIFUWACC_CONTENT_ROOT: ${{ github.workspace }}/.content
        run: pnpm exec dotenvx run -f ../../env/.env.production -- pnpm run build

      - name: Deploy web
        working-directory: apps/web
        run: pnpm exec dotenvx run -f ../../env/.env.production -- pnpm exec wrangler deploy --config wrangler.jsonc --env=""

  release:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set release tag
        env:
          TZ: "Asia/Tokyo"
        run: |
          echo "RELEASE_TAG=$(date '+%Y-%m-%d-%H%M%S')" >> $GITHUB_ENV
          echo "RELEASE_NAME=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
