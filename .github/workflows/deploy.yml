name: Deploy

on:
  workflow_call:
    inputs:
      content_repository:
        description: Repository containing the production content
        required: true
        type: string
      content_ref:
        description: Git ref of the content to deploy
        required: true
        type: string
    secrets:
      cloudflare_api_token:
        description: Cloudflare token used to publish content and deploy the site
        required: true

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: production-site-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CONTENT_BUCKET: ${{ vars.CONTENT_BUCKET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare_api_token }}
      CONTENT_REVISION: ${{ inputs.content_ref }}
      SITE_URL: https://mimifuwa.cc
    steps:
      - name: Validate production deploy configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }
          test -n "$CONTENT_BUCKET" || { echo "CONTENT_BUCKET is not configured" >&2; exit 1; }

      - name: Checkout content
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.content_repository }}
          ref: ${{ inputs.content_ref }}
          path: content

      - name: Resolve the latest stable site release
        id: site-release
        run: |
          tag="$(curl --fail --silent --show-error https://api.github.com/repos/mimifuwacc/mimifuwa.cc/releases/latest | jq --exit-status --raw-output .tag_name)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout released site
        uses: actions/checkout@v7
        with:
          repository: mimifuwacc/mimifuwa.cc
          ref: ${{ steps.site-release.outputs.tag }}
          path: mimifuwa.cc
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: mimifuwa.cc/.node-version
          cache: true
          run-install: false

      - name: Configure GitHub Packages authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npmrc_file="$RUNNER_TEMP/github-packages.npmrc"
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$npmrc_file"
          printf 'NPM_CONFIG_USERCONFIG=%s\n' "$npmrc_file" >> "$GITHUB_ENV"

      - name: Install content dependencies
        working-directory: content
        run: vp install --frozen-lockfile

      - name: Install site dependencies
        working-directory: mimifuwa.cc
        run: vp install --frozen-lockfile

      - name: Restore article OG image cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/og-image-cache
          key: ${{ runner.os }}-og-images-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-og-images-

      - name: Publish content assets
        working-directory: content
        env:
          CF_BIN: ${{ github.workspace }}/content/node_modules/.bin/cf
        run: vp dlx @mimifuwacc/cli@latest deploy

      - name: Deploy SSG site
        working-directory: mimifuwa.cc
        env:
          APP_VERSION: v${{ steps.site-release.outputs.version }}
          CONTENT_DIR: ${{ github.workspace }}/content/articles
          CONTENT_DATA_DIR: ${{ github.workspace }}/content/data
          DEPLOY_ENV: release
          OG_IMAGE_CACHE_DIR: ${{ runner.temp }}/og-image-cache
        run: |
          env_file="apps/web/.env"
          trap 'rm -f "$env_file"' EXIT
          umask 077
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLOUDFLARE_ACCOUNT_ID" > "$env_file"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CLOUDFLARE_API_TOKEN" >> "$env_file"
          printf 'OG_IMAGE_CACHE_DIR=%s\n' "$OG_IMAGE_CACHE_DIR" >> "$env_file"
          printf 'SITE_URL=%s\n' "$SITE_URL" >> "$env_file"
          node scripts/set-package-version.ts "${APP_VERSION#v}"
          vp exec --filter @mimifuwacc/web -- void deploy --platform cloudflare
