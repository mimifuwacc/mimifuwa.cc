name: Deploy and Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mimifuwa.cc
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VOID_CONTENT_PUBLISH_TOKEN: ${{ secrets.VOID_CONTENT_PUBLISH_TOKEN }}
      DEPLOY_ENV: release
    steps:
      - uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true

      - name: Build content CLI
        run: vp exec --filter @mimifuwacc/cli -- tsc -p tsconfig.json

      - name: Deploy Vue site to Void
        run: vp exec --filter @mimifuwacc/web -- void deploy --platform cloudflare

      - name: Set content publish token
        run: |
          test -n "$VOID_CONTENT_PUBLISH_TOKEN"
          printf '%s' "$VOID_CONTENT_PUBLISH_TOKEN" | vp exec --filter @mimifuwacc/web -- void secret put CONTENT_PUBLISH_TOKEN

  release:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set release tag
        env:
          TZ: "Asia/Tokyo"
        run: |
          echo "RELEASE_TAG=$(date '+%Y-%m-%d-%H%M%S')" >> $GITHUB_ENV
          echo "RELEASE_NAME=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
