name: Deploy and Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mimifuwa.cc
    # dotenvx: GitHub Secrets に載せるのは復号鍵だけ。CLOUDFLARE_* / ADMIN_SECRET /
    # Cloudflare credentials / ADMIN_SECRET are injected from the encrypted env file.
    env:
      DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate D1
        working-directory: apps/api
        run: pnpm exec dotenvx run -f ../../env/.env.production -- pnpm exec wrangler d1 migrations apply mimifuwacc-blogs --remote

      - name: Set API secret (prod)
        working-directory: apps/api
        run: pnpm exec dotenvx run -f ../../env/.env.production -- sh -c 'echo "$ADMIN_SECRET" | pnpm exec wrangler secret put API_ADMIN_SECRET'

      - name: Set cache purge token (prod)
        working-directory: apps/api
        run: pnpm exec dotenvx run -f ../../env/.env.production -- sh -c 'test -n "$CACHE_PURGE_API_TOKEN" || { echo "CACHE_PURGE_API_TOKEN is required" >&2; exit 1; }; echo "$CACHE_PURGE_API_TOKEN" | pnpm exec wrangler secret put CACHE_PURGE_API_TOKEN'

      - name: Set cache purge zone (prod)
        working-directory: apps/api
        run: >-
          pnpm exec dotenvx run -f ../../env/.env.production -- sh -c 'zone_id=$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=mimifuwa.cc&status=active" | jq -r ".result[0].id"); test -n "$zone_id" && test "$zone_id" != "null" || { echo "Unable to find the mimifuwa.cc zone" >&2; exit 1; }; echo "$zone_id" | pnpm exec wrangler secret put CLOUDFLARE_ZONE_ID'

      - name: Deploy API
        working-directory: apps/api
        run: pnpm exec dotenvx run -f ../../env/.env.production -- pnpm exec wrangler deploy --config wrangler.toml

      - name: Build web
        working-directory: apps/web
        run: pnpm exec dotenvx run -f ../../env/.env.production -- pnpm run build

      - name: Deploy web
        working-directory: apps/web
        run: pnpm exec dotenvx run -f ../../env/.env.production -- pnpm exec wrangler deploy

      - name: Build admin
        working-directory: apps/admin
        run: pnpm exec dotenvx run -f ../../env/.env.production -- pnpm run build

      - name: Set admin secret (prod)
        working-directory: apps/admin
        run: pnpm exec dotenvx run -f ../../env/.env.production -- sh -c 'echo "$ADMIN_SECRET" | pnpm exec wrangler secret put ADMIN_SECRET --config wrangler.jsonc'

      - name: Deploy admin
        working-directory: apps/admin
        run: pnpm exec dotenvx run -f ../../env/.env.production -- pnpm exec wrangler deploy --config dist/server/wrangler.json

  release:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set release tag
        env:
          TZ: "Asia/Tokyo"
        run: |
          echo "RELEASE_TAG=$(date '+%Y-%m-%d-%H%M%S')" >> $GITHUB_ENV
          echo "RELEASE_NAME=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
