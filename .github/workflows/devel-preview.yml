name: Devel Preview

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# dotenvx: GitHub Secrets に載せるのは復号鍵だけ。CLOUDFLARE_* / ADMIN_SECRET /
# Cloudflare credentials / ADMIN_SECRET are injected from the encrypted env file.
env:
  DOTENV_PRIVATE_KEY_DEVEL: ${{ secrets.DOTENV_PRIVATE_KEY_DEVEL }}

jobs:
  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: apps/web
        env:
          API_URL: https://mimifuwacc-api-devel.m8c.workers.dev
          CLOUDFLARE_ENV: devel
        run: pnpm exec dotenvx run -f ../../env/.env.devel -- pnpm run build

      - name: Deploy web to Cloudflare
        working-directory: apps/web
        env:
          CLOUDFLARE_ENV: devel
        run: pnpm exec dotenvx run -f ../../env/.env.devel -- pnpm exec wrangler deploy

  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate D1 (devel)
        working-directory: apps/api
        run: pnpm exec dotenvx run -f ../../env/.env.devel -- pnpm exec wrangler d1 migrations apply mimifuwacc-blogs-devel --env devel --remote

      - name: Set API secret (devel)
        working-directory: apps/api
        run: pnpm exec dotenvx run -f ../../env/.env.devel -- sh -c 'echo "$ADMIN_SECRET" | pnpm exec wrangler secret put API_ADMIN_SECRET --env devel'

      - name: Deploy API to Cloudflare
        working-directory: apps/api
        run: pnpm exec dotenvx run -f ../../env/.env.devel -- pnpm exec wrangler deploy --env devel

  deploy-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin
        working-directory: apps/admin
        env:
          API_URL: https://mimifuwacc-api-devel.m8c.workers.dev
          NEXT_PUBLIC_API_URL: https://mimifuwacc-api-devel.m8c.workers.dev
        run: pnpm exec dotenvx run -f ../../env/.env.devel -- pnpm exec opennextjs-cloudflare build

      - name: Set admin secret (devel)
        working-directory: apps/admin
        run: pnpm exec dotenvx run -f ../../env/.env.devel -- sh -c 'echo "$ADMIN_SECRET" | pnpm exec wrangler secret put ADMIN_SECRET --config wrangler.devel.jsonc'

      - name: Deploy admin to Cloudflare
        working-directory: apps/admin
        run: pnpm exec dotenvx run -f ../../env/.env.devel -- pnpm exec wrangler deploy --config wrangler.devel.jsonc
