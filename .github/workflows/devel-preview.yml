name: Devel Preview

on:
  push:
    branches:
      - devel
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# dotenvx: GitHub Secrets に載せるのは復号鍵だけ。CLOUDFLARE_* / ADMIN_SECRET /
# GRAPHQL_URL は暗号化済み .env.devel から dotenvx run 経由で注入される。
env:
  DOTENV_PRIVATE_KEY_DEVEL: ${{ secrets.DOTENV_PRIVATE_KEY_DEVEL }}

jobs:
  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: apps/web
        run: pnpm exec dotenvx run -f ../../.env.devel -- pnpm run build

      - name: Deploy web to Cloudflare
        working-directory: apps/web
        run: pnpm exec dotenvx run -f ../../.env.devel -- pnpm exec wrangler deploy --config wrangler.devel.jsonc

  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate D1 (devel)
        working-directory: apps/api
        run: pnpm exec dotenvx run -f ../../.env.devel -- pnpm exec wrangler d1 migrations apply mimifuwacc-blogs-devel --env devel --remote

      - name: Set API secret (devel)
        working-directory: apps/api
        run: pnpm exec dotenvx run -f ../../.env.devel -- sh -c 'echo "$ADMIN_SECRET" | pnpm exec wrangler secret put ADMIN_SECRET --env devel'

      - name: Deploy API to Cloudflare
        working-directory: apps/api
        run: pnpm exec dotenvx run -f ../../.env.devel -- pnpm exec wrangler deploy --env devel

  deploy-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin
        working-directory: apps/admin
        run: pnpm exec dotenvx run -f ../../.env.devel -- pnpm exec opennextjs-cloudflare build

      - name: Set admin secret (devel)
        working-directory: apps/admin
        run: pnpm exec dotenvx run -f ../../.env.devel -- sh -c 'echo "$ADMIN_SECRET" | pnpm exec wrangler secret put ADMIN_SECRET --config wrangler.devel.jsonc'

      - name: Deploy admin to Cloudflare
        working-directory: apps/admin
        run: pnpm exec dotenvx run -f ../../.env.devel -- pnpm exec wrangler deploy --config wrangler.devel.jsonc
