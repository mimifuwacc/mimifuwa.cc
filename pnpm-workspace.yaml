minimumReleaseAge: 4320

packages:
  - apps/web
  - packages/cli
  - packages/content-dev

onlyBuiltDependencies:
  - core-js-pure
  - esbuild
  - msw
  - sharp
  - workerd

catalog:
  typescript: "^7.0.0"
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  better-sqlite3: true
  esbuild: true
  puppeteer: true
  sharp: true
  workerd: true
