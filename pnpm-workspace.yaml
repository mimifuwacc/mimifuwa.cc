minimumReleaseAge: 4320

packages:
  - apps/web-vue
  - packages/cli
  - packages/content-dev

onlyBuiltDependencies:
  - core-js-pure
  - esbuild
  - msw
  - sharp
  - workerd

catalog:
  typescript: "^6.0.0"
  vite: npm:@voidzero-dev/vite-plus-core@0.1.24
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.24
  vite-plus: 0.1.24

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  better-sqlite3: true
  esbuild: true
  puppeteer: true
  sharp: true
  workerd: true
