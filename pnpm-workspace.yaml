minimumReleaseAge: 4320

packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - core-js-pure
  - esbuild
  - msw
  - sharp
  - workerd

catalog:
  # React
  react: "^19.2.0"
  react-dom: "^19.2.0"
  "@types/react": "^19.2.15"
  "@types/react-dom": "^19.2.3"

  # Tailwind
  tailwindcss: "^4.1.13"
  "@tailwindcss/vite": "^4.1.13"
  "@tailwindcss/postcss": "^4.1.13"
  tw-animate-css: "^1.4.0"
  shadcn: "^4.7.0"

  # UI primitives
  "@base-ui/react": "^1.5.0"
  "@tanstack/react-query": "^5.0.0"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  tailwind-merge: "^3.6.0"
  lucide-react: "^1.16.0"
  react-icons: "^5.5.0"
  framer-motion: "^11.0.0"

  # GraphQL
  graphql: "^17.0.0"
  graphql-request: "^7.4.0"
  graphql-yoga: "^5.13.1"

  # Cloudflare / infra
  hono: "^4.6.20"
  wrangler: "^4.76.0"
  "@cloudflare/workers-types": "^4.20250521.0"
  "@opennextjs/cloudflare": "^1.18.0"

  # Misc shared
  highlight.js: "^11.11.1"
  typescript: "^5.8.3"
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest

overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
