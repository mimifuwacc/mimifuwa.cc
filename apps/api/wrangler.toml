name = "mimifuwacc-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "mimifuwacc-blogs"
database_id = "ac1c88bc-d531-49d9-a10c-dad6ff637972"

# R2 Bucket
[[r2_buckets]]
binding = "R2"
bucket_name = "mimifuwacc-blogs"

# Environment variables
[vars]
ENVIRONMENT = "production"

# Devel preview environment
[env.devel]
name = "mimifuwacc-api-devel"
main = "src/index.ts"

[env.devel.vars]
ENVIRONMENT = "devel"

[[env.devel.d1_databases]]
binding = "DB"
database_name = "mimifuwacc-blogs-devel"
database_id = "b526fab7-0431-4d97-8553-2a6cbc2bdfce"

[[env.devel.r2_buckets]]
binding = "R2"
bucket_name = "mimifuwacc-blogs-devel"
