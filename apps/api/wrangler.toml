name = "mimifuwacc-api"
main = "src/index.ts"
workers_dev = false
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat_v2"]

[[routes]]
pattern = "api.mimifuwa.cc"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "mimifuwacc-blogs"
database_id = "ac1c88bc-d531-49d9-a10c-dad6ff637972"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "R2"
bucket_name = "mimifuwacc-blogs"

# API_ADMIN_SECRET is configured with `wrangler secret put` for deployed environments.
# Local development passes a non-production value from the package script.
[env.dev]
name = "mimifuwacc-api-dev"
workers_dev = false

[[env.dev.routes]]
pattern = "api-dev.mimifuwa.cc"
custom_domain = true

[[env.dev.d1_databases]]
binding = "DB"
database_name = "mimifuwacc-blogs-dev"
database_id = "b526fab7-0431-4d97-8553-2a6cbc2bdfce"
migrations_dir = "drizzle"

[[env.dev.r2_buckets]]
binding = "R2"
bucket_name = "mimifuwacc-blogs-dev"
