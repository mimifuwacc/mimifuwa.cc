# GraphQL Schema for Blog API
scalar Cursor
scalar Time

# Pagination inputs
input PageInput {
  first: Int = 20
  after: Cursor
}

# Pagination metadata
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: Cursor
  endCursor: Cursor
  totalCount: Int!
}

# Blog Post types
type BlogPost {
  id: ID!
  slug: String!
  r2Key: String!
  title: String!
  excerpt: String!
  content: String!
  date: Time!
  tags: [Tag!]!
  draft: Boolean!
  contentHash: String
  createdAt: Time!
  updatedAt: Time!
}

type BlogPostEdge {
  node: BlogPost!
  cursor: Cursor!
}

type BlogPostConnection {
  edges: [BlogPostEdge!]!
  pageInfo: PageInfo!
}

# Tag type
type Tag {
  id: ID!
  name: String!
}

# Filters for blog posts
input BlogPostFilter {
  draft: Boolean
  tag: String
  search: String
  dateAfter: Time
  dateBefore: Time
}

# Input types for mutations
input CreateBlogPostInput {
  slug: String!
  title: String!
  excerpt: String!
  content: String!
  date: Time!
  tags: [String!]!
  draft: Boolean = false
}

input UpdateBlogPostInput {
  slug: String!
  title: String
  excerpt: String
  content: String
  date: Time
  tags: [String!]
  draft: Boolean
}

# Response type for mutations
type MutationResponse {
  success: Boolean!
  message: String!
  blogPost: BlogPost
}

# Queries
type Query {
  """Get a single blog post by slug"""
  blogPost(slug: String!): BlogPost

  """List blog posts with pagination and filtering"""
  blogPosts(filter: BlogPostFilter, page: PageInput): BlogPostConnection!

  """Get all tags"""
  tags: [Tag!]!
}

# Mutations
type Mutation {
  """Create a new blog post"""
  createBlogPost(input: CreateBlogPostInput!): MutationResponse!

  """Update an existing blog post"""
  updateBlogPost(input: UpdateBlogPostInput!): MutationResponse!

  """Delete a blog post (hard delete)"""
  deleteBlogPost(slug: String!): MutationResponse!

  """Archive a blog post (soft delete - sets draft=true)"""
  archiveBlogPost(slug: String!): MutationResponse!
}
