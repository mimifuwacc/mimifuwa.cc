# gqlgen configuration
# https://gqlgen.com/config/

# Where are all the schema files located?
schema:
  - internal/graphql/schema.graphql

# Where should the generated server code go?
exec:
  filename: internal/graphql/generated.go
  package: graphql
  layout: follow-schema

  # For follow-schema layout:
  dir: internal/graphql

# Where should any generated models go?
model:
  filename: internal/graphql/models/generated.go
  package: models

# Where should the resolver implementations go?
resolver:
  layout: follow-schema
  dir: internal/graphql
  package: graphql
  filename_template: "{name}.resolvers.go"

# gqlgen will search for any type names in the schema in these go packages
# if they match it will use them, otherwise it will generate them.
autobind: []

# This section declares type mapping between the GraphQL and go type systems
models:
  Cursor:
    model: github.com/mimifuwacc/api/internal/graphql/cursor.Cursor
  Time:
    model: github.com/mimifuwacc/api/internal/graphql/scalar.Time
